name: Build Android TV APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Copy the site into the app
        run: |
          site=android/app/src/main/assets/site
          mkdir -p "$site"
          cp -r index.html css js data fonts icons "$site/"
          # ملفات التطبيق لا تحتاج أرقام الإصدار، وبعض إصدارات Android لا تفتح الملف معها
          sed -i -E 's/\?v=[0-9]+//g' "$site/index.html" "$site/js/data.js"
          # لا مصدر محلي ولا Service Worker داخل التطبيق
          sed -i '/local-sources\.js/d;/manifest\.json/d' "$site/index.html"

      # بالمفتاح الثابت تُثبَّت كل نسخة فوق السابقة دون فقد التقدم
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Signing secrets are missing"
            exit 1
          fi
          store="$RUNNER_TEMP/app.keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$store"
          echo "SIGNING_KEYSTORE=$store" >> "$GITHUB_ENV"
          echo "SIGNING_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk quran-majlis.apk

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-app
          name: تطبيق التلفزيون
          body: نسخة التطبيق لتلفزيون Android. نزّل ملف quran-majlis.apk وثبّته.
          make_latest: true
          files: quran-majlis.apk
